<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Girl ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root { --pink: #ff4d6d; --bg: #ffe5ec; }
        *, *:before, *:after { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            min-height: 100vh; display: flex; justify-content: center; align-items: center; 
            background-color: var(--bg); font-family: 'Pacifico', cursive; overflow: hidden; 
        }

        .main-wrapper {
            position: relative; display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 600px; z-index: 1;
        }

        .bear-box { height: 150px; z-index: 2; pointer-events: none; }
        .bear-box img { width: 140px; border-radius: 20px; }

        /* ANIMATION AREA */
        .stage { width: 500px; height: 160px; position: relative; margin: 10px 0; pointer-events: none; }
        .svg-layer { position: absolute; width: 100%; height: 100%; z-index: 2; }
        .mo-layer { position: absolute; width: 100%; height: 100%; z-index: 1; }
        
        .line { fill: none; stroke: var(--pink); stroke-width: 8; stroke-linecap: round; }
        .lttr { fill: var(--pink); opacity: 0; }

        /* INTERACTION LAYER - This MUST be highest z-index */
        .ui-layer { 
            position: relative; width: 100%; display: flex; flex-direction: column; 
            align-items: center; z-index: 9999; 
        }
        
        .question { color: #fb6f92; font-size: 2rem; margin-bottom: 20px; pointer-events: none; }
        
        .btn-wrap { 
            display: flex; justify-content: center; align-items: center; 
            gap: 40px; min-height: 150px; width: 100%; position: relative; 
        }
        
        button { 
            padding: 15px 40px; font-size: 1.4rem; font-family: 'Pacifico', cursive; 
            border: none; border-radius: 50px; cursor: pointer; 
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.2); 
            transition: transform 0.15s ease;
        }

        #yesBtn { background: var(--pink); color: white; position: relative; z-index: 10000; }
        #noBtn { 
            background: white; color: var(--pink); 
            position: absolute; left: 55%; z-index: 10001; 
            transition: none; /* Instant move */
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div class="bear-box">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueGZ3eHpkZzR4NXp4NXp4NXp4NXp4NXp4NXp4NXp4NXp4NXp4JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1z/icoW4Mscid9t6IIDM1/giphy.gif" id="bearImg">
        </div>

        <div class="stage">
            <svg class="svg-layer" viewBox="0 0 500 200">
                <line class="line line--left" x1="10" y1="17" x2="10" y2="183"></line>
                <line class="line line--rght" x1="490" y1="17" x2="490" y2="183"></line>
                <g id="letters">
                    <path class="lttr lttr--I" d="M42.2,73.9h11.4v52.1H42.2V73.9z"></path>
                    <path class="lttr lttr--L" d="M85.1,73.9h11.4v42.1h22.8v10H85.1V73.9z"></path>
                    <path class="lttr lttr--O" d="M123.9,100c0-15.2,11.7-26.9,27.2-26.9s27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9S123.9,115.2,123.9,100zM166.9,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C160.1,116.5,166.9,109.2,166.9,100z"></path>
                    <path class="lttr lttr--V" d="M180.7,73.9H193l8.4,22.9c1.7,4.7,3.5,9.5,5,14.2h0.1c1.7-4.8,3.4-9.4,5.2-14.3l8.6-22.8h11.7l-19.9,52.1h-11.5L180.7,73.9z"></path>
                    <path class="lttr lttr--E" d="M239.1,73.9h32.2v10h-20.7v10.2h17.9v9.5h-17.9v12.4H272v10h-33V73.9z"></path>
                    <path class="lttr lttr--Y" d="M315.8,102.5l-20.1-28.6H309l6.3,9.4c2,3,4.2,6.4,6.3,9.6h0.1c2-3.2,4.1-6.4,6.3-9.6l6.3-9.4h12.9l-19.9,28.5v23.6h-11.4V102.5z"></path>
                    <path class="lttr lttr--O2" d="M348.8,100c0-15.2,11.7-26.9,27.2-26.9c15.5,0,27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9C360.5,126.9,348.8,115.2,348.8,100z M391.8,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C385,116.5,391.8,109.2,391.8,100z"></path>
                    <path class="lttr lttr--U" d="M412.4,101.1V73.9h11.4v26.7c0,10.9,2.4,15.9,11.5,15.9c8.4,0,11.4-4.6,11.4-15.8V73.9h11v26.9c0,7.8-1.1,13.5-4,17.7c-3.7,5.3-10.4,8.4-18.7,8.4c-8.4,0-15.1-3.1-18.8-8.5C413.4,114.2,412.4,108.5,412.4,101.1z"></path>
                </g>
            </svg>
            <div class="mo-layer" id="mo-container"></div>
        </div>

        <div class="ui-layer">
            <h1 class="question">Will you be my Valentine?</h1>
            <div class="btn-wrap">
                <button id="yesBtn">Yes! ❤️</button>
                <button id="noBtn">No</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/mojs/latest/mo.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        const el = {
            container: document.querySelector("#mo-container"),
            letters: document.querySelectorAll(".lttr"),
            lineLeft: document.querySelector(".line--left"),
            lineRight: document.querySelector(".line--rght"),
            no: document.querySelector("#noBtn"),
            yes: document.querySelector("#yesBtn"),
            bear: document.querySelector("#bearImg")
        };

        // Professional Mo.js Setup
        const easingHeart = mojs.easing.path("M0,100C2.9,86.7,33.6-7.3,46-7.3s15.2,22.7,26,22.7S89,0,100,0");

        class Heart extends mojs.CustomShape {
            getShape() { return '<path d="M50,88.9C25.5,78.2,0.5,54.4,3.8,31.1S41.3,1.8,50,29.9c8.7-28.2,42.8-22.2,46.2,1.2S74.5,78.2,50,88.9z"/>'; }
            getLength() { return 200; }
        }
        mojs.addShape("heart", Heart);

        const boom = (x) => new mojs.Burst({
            parent: el.container, radius: { 40: 100 }, count: 10, x,
            children: { shape: 'circle', fill: '#ff4d6d', duration: 500 }
        });

        const timeline = new mojs.Timeline().add([
            new mojs.Html({
                el: el.lineLeft, x: { 0: 150 }, duration: 1000, easing: 'bounce.out'
            }).then({ x: 0, duration: 800, delay: 2000 }),
            new mojs.Html({
                el: el.lineRight, x: { 0: -150 }, duration: 1000, easing: 'bounce.out'
            }).then({ x: 0, duration: 800, delay: 2000 }),
            new mojs.Tween({
                duration: 1000, onUpdate: (p) => el.letters.forEach(l => l.style.opacity = p)
            }),
            new mojs.Shape({
                parent: el.container, shape: 'heart', fill: '#ff4d6d', scale: {0: 1}, duration: 1000, easing: easingHeart
            }).then({ scale: 0, duration: 500, delay: 1000 })
        ]);

        const run = () => { timeline.replay(); setTimeout(run, 5000); };
        run();

        // Button Fixes
        let scale = 1;
        const moveNo = () => {
            const x = Math.random() * (window.innerWidth - el.no.offsetWidth);
            const y = Math.random() * (window.innerHeight - el.no.offsetHeight);
            el.no.style.left = x + "px";
            el.no.style.top = y + "px";
            scale += 0.15;
            el.yes.style.transform = `scale(${scale})`;
            el.bear.src = "https://media.tenor.com/XGf8O27Y-KAAAAAi/milk-and-mocha-bear.gif";
        };

        el.no.addEventListener('mouseover', moveNo);
        el.no.addEventListener('touchstart', (e) => { e.preventDefault(); moveNo(); });

        el.yes.addEventListener('click', () => {
            document.querySelector(".question").innerHTML = "I Love You Forever! ❤️";
            document.querySelector(".btn-wrap").style.display = "none";
            el.bear.src = "https://media.tenor.com/Z-7u8mO0GvUAAAAi/milk-and-mocha.gif";
            confetti({ particleCount: 150, spread: 70 });
        });
    </script>
</body>
</html>
