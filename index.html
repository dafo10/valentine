<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Valentine ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root { --pink: #ff4d6d; --soft-pink: #ffe5ec; }
    *, *:before, *:after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      min-height: 100vh; display: flex; justify-content: center; align-items: center; 
      background-color: var(--soft-pink); font-family: 'Pacifico', cursive; overflow: hidden; 
    }

    .card { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; z-index: 10; }

    /* BEAR SECTION */
    .bear-box img { width: 160px; margin-bottom: 10px; pointer-events: none; }

    /* PRO-ANIMATION SECTION (CSS ONLY) */
    .anim-container { width: 500px; height: 180px; position: relative; margin: 20px 0; }
    
    .svg-canvas { width: 100%; height: 100%; fill: var(--pink); }

    /* The Moving Lines */
    .line { fill: none; stroke: var(--pink); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 200; stroke-dashoffset: 200; animation: drawLine 4s infinite; }
    @keyframes drawLine {
      0% { stroke-dashoffset: 200; opacity: 0; }
      20% { stroke-dashoffset: 0; opacity: 1; }
      80% { stroke-dashoffset: 0; opacity: 1; }
      100% { stroke-dashoffset: -200; opacity: 0; }
    }

    /* The Popping Heart */
    .heart { fill: var(--pink); opacity: 0; transform-origin: center; animation: heartPop 4s infinite; }
    @keyframes heartPop {
      0%, 20% { opacity: 0; transform: translate(220px, 70px) scale(0); }
      35% { opacity: 1; transform: translate(220px, 70px) scale(1.2); }
      50% { transform: translate(220px, 70px) scale(1); }
      80% { opacity: 1; transform: translate(220px, 70px) scale(1); }
      100% { opacity: 0; transform: translate(220px, 70px) scale(0); }
    }

    /* The Letters */
    .lttr { opacity: 0; animation: fadeLetters 4s infinite; }
    @keyframes fadeLetters {
      0%, 30% { opacity: 0; }
      40%, 80% { opacity: 1; }
      100% { opacity: 0; }
    }

    /* BUTTONS */
    .question { color: #fb6f92; font-size: 2rem; margin-bottom: 20px; text-shadow: 2px 2px white; }
    .btn-wrap { display: flex; justify-content: center; align-items: center; gap: 30px; min-height: 120px; width: 100%; position: relative; }
    
    button { padding: 15px 35px; font-size: 1.4rem; font-family: 'Pacifico', cursive; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 15px rgba(255, 77, 109, 0.2); transition: transform 0.2s; }
    #yes { background: var(--pink); color: white; z-index: 100; }
    #no { background: white; color: var(--pink); position: absolute; z-index: 100; left: 55%; }
  </style>
</head>
<body>

  <div class="card">
    <div class="bear-box">
      <img src="https://media.tenor.com/7S8l0N9M7mUAAAAi/milk-and-mocha-bear-couple.gif" id="mainBear">
    </div>

    <div class="anim-container">
      <svg class="svg-canvas" viewBox="0 0 500 200">
        <path class="line" d="M10,20 L10,180" />
        <path class="line" d="M490,20 L490,180" />
        
        <path class="heart" d="M30,50 C30,20 70,20 70,50 C70,80 30,110 30,110 C30,110 -10,80 -10,50 C-10,20 30,20 30,50" />

        <g class="lttr">
          <path d="M42.2,73.9h11.4v52.1H42.2V73.9z"></path> <path d="M85.1,73.9h11.4v42.1h22.8v10H85.1V73.9z"></path> <path d="M123.9,100c0-15.2,11.7-26.9,27.2-26.9s27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9S123.9,115.2,123.9,100zM166.9,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C160.1,116.5,166.9,109.2,166.9,100z"></path> <path d="M180.7,73.9H193l8.4,22.9c1.7,4.7,3.5,9.5,5,14.2h0.1c1.7-4.8,3.4-9.4,5.2-14.3l8.6-22.8h11.7l-19.9,52.1h-11.5L180.7,73.9z"></path> <path d="M239.1,73.9h32.2v10h-20.7v10.2h17.9v9.5h-17.9v12.4H272v10h-33V73.9z"></path> <path d="M315.8,102.5l-20.1-28.6H309l6.3,9.4c2,3,4.2,6.4,6.3,9.6h0.1c2-3.2,4.1-6.4,6.3-9.6l6.3-9.4h12.9l-19.9,28.5v23.6h-11.4V102.5z"></path> <path d="M348.8,100c0-15.2,11.7-26.9,27.2-26.9c15.5,0,27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9C360.5,126.9,348.8,115.2,348.8,100z M391.8,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C385,116.5,391.8,109.2,391.8,100z"></path> <path d="M412.4,101.1V73.9h11.4v26.7c0,10.9,2.4,15.9,11.5,15.9c8.4,0,11.4-4.6,11.4-15.8V73.9h11v26.9c0,7.8-1.1,13.5-4,17.7c-3.7,5.3-10.4,8.4-18.7,8.4c-8.4,0-15.1-3.1-18.8-8.5C413.4,114.2,412.4,108.5,412.4,101.1z"></path> </g>
      </svg>
    </div>

    <h1 class="question">Will you be my Valentine?</h1>
    
    <div class="btn-wrap">
      <button id="yes">Yes! ❤️</button>
      <button id="no">No</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const bear = document.getElementById('mainBear');
    let scale = 1;

    function moveNo() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      
      scale += 0.15;
      yesBtn.style.transform = `scale(${scale})`;
      bear.src = "https://media.tenor.com/XGf8O27Y-KAAAAAi/milk-and-mocha-bear.gif";
    }

    noBtn.addEventListener('mouseover', moveNo);
    noBtn.addEventListener('touchstart', moveNo);

    yesBtn.addEventListener('click', () => {
      document.querySelector('.question').innerHTML = "I Love You Forever! ❤️";
      document.querySelector('.btn-wrap').style.display = 'none';
      document.querySelector('.anim-container').style.display = 'none';
      bear.src = "https://media.tenor.com/Z-7u8mO0GvUAAAAi/milk-and-mocha.gif";
      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    });
  </script>
</body>
</html>
