<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine ❤️</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <div class="photo-frame">
       <img src="your-photo.jpg" 
     onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=500';" 
     style="width:100%; height:100%; object-fit:cover;">
    </div>

    <div class="love-box">
        <span class="heart">❤️</span>
        <h1 class="text">I LOVE YOU</h1>
        <span class="heart">❤️</span>
    </div>

    <h2 class="question" id="qText">Will you be my Valentine?</h2>

    <div class="btn-group">
        <button id="yesBtn">Yes! ❤️</button>
        <button id="noBtn">No</button>
    </div>
</div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
