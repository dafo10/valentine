<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My FATHI ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; background: #ffe5ec; font-family: 'Pacifico', cursive; 
            display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden;
        }
        .container { text-align: center; width: 90%; max-width: 400px; padding: 20px; background: white; border-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }

        /* Fail-safe Bear (Emoji) */
        .bear-emoji { font-size: 80px; margin-bottom: 10px; display: block; }

        /* Photo Frame */
        .photo-frame {
            width: 130px; height: 130px; margin: 0 auto 20px;
            border: 5px solid #ff4d6d; border-radius: 50%; overflow: hidden;
            background: #ffd1dc; display: flex; align-items: center; justify-content: center;
        }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        .photo-placeholder { font-size: 40px; }

        /* Beating Animation */
        .love-box { display: flex; align-items: center; justify-content: center; gap: 15px; margin: 20px 0; }
        .heart { font-size: 35px; color: #ff4d6d; animation: beat 0.6s infinite alternate; }
        .text { font-size: 2.2rem; color: #c9184a; margin: 0; }

        @keyframes beat { to { transform: scale(1.3); } }

        .question { color: #c9184a; font-size: 1.5rem; margin-bottom: 25px; }
        .btn-group { position: relative; height: 120px; width: 100%; }
        
        button { 
            padding: 15px 35px; font-size: 1.2rem; border-radius: 50px; border: none; 
            cursor: pointer; font-family: 'Pacifico', cursive; transition: transform 0.1s;
        }
        #yesBtn { background: #ff4d6d; color: white; box-shadow: 0 5px 15px rgba(255, 77, 109, 0.4); }
        #noBtn { background: #f0f0f0; color: #ff4d6d; position: absolute; left: 50%; transform: translateX(-50%); }
    </style>
</head>
<body>

<div class="container">
    <div class="photo-frame">
        <img src="your-photo.jpg" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='block';">
        <div id="placeholder" class="photo-placeholder" style="display:none;">📸</div>
    </div>

    <span class="bear-emoji" id="bearCharacter">🧸</span>

    <div class="love-box">
        <div class="heart">❤️</div>
        <h1 class="text">I LOVE YOU</h1>
        <div class="heart">❤️</div>
    </div>

    <h2 class="question" id="qText">Will you be my Valentine?</h2>

    <div class="btn-group">
        <button id="yesBtn">Yes! ❤️</button>
        <button id="noBtn">No</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const bear = document.getElementById('bearCharacter');
    const qText = document.getElementById('qText');
    let scale = 1;

    noBtn.addEventListener('mouseover', moveNo);
    noBtn.addEventListener('touchstart', moveNo);

    function moveNo() {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.position = 'fixed';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
        scale += 0.2;
        yesBtn.style.transform = `scale(${scale})`;
        bear.innerHTML = "🥺"; // Bear gets sad when you hover 'No'
    }

    yesBtn.addEventListener('click', () => {
        qText.innerHTML = "I Knew You'd Say Yes! ❤️";
        document.querySelector('.btn-group').style.display = 'none';
        bear.innerHTML = "🥰"; // Bear gets happy!
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    });
</script>
</body>
</html>
