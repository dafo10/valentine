<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Girl ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    *, *:before, *:after { box-sizing: border-box; margin: 0; padding: 0; }
    body { 
      min-height: 100vh; display: flex; justify-content: center; align-items: center; 
      background-color: #ffe5ec; font-family: 'Pacifico', cursive; overflow: hidden; 
    }
    .main-card { display: flex; flex-direction: column; align-items: center; z-index: 10; text-align: center; width: 100%; }
    
    .bear-container img { width: 160px; height: auto; margin-bottom: 10px; pointer-events: none; }

    /* PURE CSS ANIMATION FOR THE LETTERS */
    .container { width: 500px; height: 150px; position: relative; display: flex; justify-content: center; align-items: center; }
    
    .text-svg { width: 100%; height: auto; fill: #ff4d6d; }
    
    /* Animation for the letters popping in */
    .lttr {
      opacity: 0;
      animation: popIn 4s infinite;
    }

    @keyframes popIn {
      0%, 10% { opacity: 0; transform: scale(0.5); }
      20%, 80% { opacity: 1; transform: scale(1); }
      90%, 100% { opacity: 0; transform: scale(1.1); }
    }

    /* Staggered delay for each letter to make it look smooth */
    .lttr--I { animation-delay: 0.1s; }
    .lttr--L { animation-delay: 0.2s; }
    .lttr--O { animation-delay: 0.3s; }
    .lttr--V { animation-delay: 0.4s; }
    .lttr--E { animation-delay: 0.5s; }
    .lttr--Y { animation-delay: 0.6s; }
    .lttr--O2 { animation-delay: 0.7s; }
    .lttr--U { animation-delay: 0.8s; }

    /* Interaction Area */
    .question { color: #fb6f92; font-size: 1.8rem; margin-top: 15px; }
    .btn-group { 
      display: flex; justify-content: center; align-items: center; 
      gap: 30px; min-height: 150px; width: 100%; position: relative; 
    }
    
    button { 
      padding: 12px 25px; font-size: 1.2rem; font-family: 'Pacifico', cursive; 
      border: none; border-radius: 50px; cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
    }
    #yesBtn { background-color: #ff4d6d; color: white; z-index: 100; }
    #noBtn { background-color: #ffffff; color: #ff4d6d; position: absolute; z-index: 100; left: 55%; }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="bear-container">
      <img src="https://media.tenor.com/7S8l0N9M7mUAAAAi/milk-and-mocha-bear-couple.gif" id="bearImg">
    </div>

    <div class="container">
      <svg class="text-svg" viewBox="0 0 500 150">
        <g>
          <path class="lttr lttr--I" d="M42.2,73.9h11.4v52.1H42.2V73.9z"></path>
          <path class="lttr lttr--L" d="M85.1,73.9h11.4v42.1h22.8v10H85.1V73.9z"></path>
          <path class="lttr lttr--O" d="M123.9,100c0-15.2,11.7-26.9,27.2-26.9s27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9S123.9,115.2,123.9,100zM166.9,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C160.1,116.5,166.9,109.2,166.9,100z"></path>
          <path class="lttr lttr--V" d="M180.7,73.9H193l8.4,22.9c1.7,4.7,3.5,9.5,5,14.2h0.1c1.7-4.8,3.4-9.4,5.2-14.3l8.6-22.8h11.7l-19.9,52.1h-11.5L180.7,73.9z"></path>
          <path class="lttr lttr--E" d="M239.1,73.9h32.2v10h-20.7v10.2h17.9v9.5h-17.9v12.4H272v10h-33V73.9z"></path>
          <path class="lttr lttr--Y" d="M315.8,102.5l-20.1-28.6H309l6.3,9.4c2,3,4.2,6.4,6.3,9.6h0.1c2-3.2,4.1-6.4,6.3-9.6l6.3-9.4h12.9l-19.9,28.5v23.6h-11.4V102.5z"></path>
          <path class="lttr lttr--O2" d="M348.8,100c0-15.2,11.7-26.9,27.2-26.9c15.5,0,27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9C360.5,126.9,348.8,115.2,348.8,100z M391.8,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C385,116.5,391.8,109.2,391.8,100z"></path>
          <path class="lttr lttr--U" d="M412.4,101.1V73.9h11.4v26.7c0,10.9,2.4,15.9,11.5,15.9c8.4,0,11.4-4.6,11.4-15.8V73.9h11v26.9c0,7.8-1.1,13.5-4,17.7c-3.7,5.3-10.4,8.4-18.7,8.4c-8.4,0-15.1-3.1-18.8-8.5C413.4,114.2,412.4,108.5,412.4,101.1z"></path>
        </g>
      </svg>
    </div>

    <h1 class="question">Will you be my Valentine?</h1>
    
    <div class="btn-group">
      <button id="yesBtn">Yes! ❤️</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const bearImg = document.getElementById('bearImg');
    const questionText = document.querySelector('.question');
    let yesSize = 1.2;

    function moveNoButton() {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.position = 'fixed';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';

        yesSize += 0.4;
        yesBtn.style.fontSize = yesSize + 'rem';
        yesBtn.style.padding = (12 + yesSize * 4) + 'px ' + (25 + yesSize * 8) + 'px';
        bearImg.src = "https://media.tenor.com/XGf8O27Y-KAAAAAi/milk-and-mocha-bear.gif";
    }

    noBtn.addEventListener('mouseover', moveNoButton);
    noBtn.addEventListener('click', moveNoButton);

    yesBtn.addEventListener('click', () => {
        questionText.innerHTML = "I Love You So Much! ❤️";
        document.querySelector('.btn-group').style.display = 'none';
        document.querySelector('.container').style.display = 'none';
        bearImg.src = "https://media.tenor.com/Z-7u8mO0GvUAAAAi/milk-and-mocha.gif"; 
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    });
  </script>
</body>
</html>
