<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root { --accent: #ff4d6d; --bg: #ffe5ec; }
    *, *:before, *:after { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      min-height: 100vh; display: flex; justify-content: center; align-items: center; 
      background-color: var(--bg); font-family: 'Pacifico', cursive; overflow: hidden; 
    }

    .card { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 600px; }

    /* BEAR FIX */
    .bear-box img { width: 180px; height: auto; border-radius: 20px; }

    /* PRO MOTION GRAPHICS ANIMATION */
    .anim-box { width: 500px; height: 200px; position: relative; margin: 10px 0; }
    
    .svg-main { width: 100%; height: 100%; fill: var(--accent); overflow: visible; }

    /* Snap-Action Lines */
    .line { 
      fill: none; stroke: var(--accent); stroke-width: 10; stroke-linecap: round;
      stroke-dasharray: 200; stroke-dashoffset: 200;
      animation: snapLine 3s cubic-bezier(0.68, -0.6, 0.32, 1.6) infinite; 
    }
    @keyframes snapLine {
      0% { stroke-dashoffset: 200; }
      30%, 70% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }

    /* Elastic Letter Reveal */
    .lttr { 
      opacity: 0; 
      transform-origin: center;
      animation: elasticLetters 3s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite; 
    }
    @keyframes elasticLetters {
      0%, 20% { opacity: 0; transform: scale(0.8) translateY(10px); }
      40%, 80% { opacity: 1; transform: scale(1) translateY(0); }
      100% { opacity: 0; transform: scale(1.1); }
    }

    /* Professional Heart Pulse */
    .heart-pro { 
      fill: var(--accent); opacity: 0; 
      animation: heartBeat 3s ease-in-out infinite; 
    }
    @keyframes heartBeat {
      0%, 30% { opacity: 0; transform: translate(220px, 60px) scale(0); }
      45% { opacity: 1; transform: translate(220px, 60px) scale(1.3); }
      55% { transform: translate(220px, 60px) scale(1); }
      65% { transform: translate(220px, 60px) scale(1.2); }
      80% { opacity: 1; transform: translate(220px, 60px) scale(1); }
      100% { opacity: 0; transform: translate(220px, 60px) scale(0); }
    }

    /* BUTTONS */
    .question { color: var(--accent); font-size: 2.2rem; margin: 15px 0; }
    .btn-row { display: flex; justify-content: center; align-items: center; gap: 40px; min-height: 150px; width: 100%; position: relative; }
    
    button { padding: 15px 40px; font-size: 1.5rem; font-family: 'Pacifico', cursive; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 20px rgba(255, 77, 109, 0.3); transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    #yes { background: var(--accent); color: white; z-index: 1000; }
    #no { background: white; color: var(--accent); position: absolute; z-index: 1000; left: 55%; }
    
    button:active { transform: scale(0.9); }
  </style>
</head>
<body>

  <div class="card">
    <div class="bear-box">
      <img src="https://gifdb.com/images/high/milk-and-mocha-bear-couple-sweet-0p260r8o7gqnd262.gif" id="bear" alt="cute bears">
    </div>

    <div class="anim-box">
      <svg class="svg-main" viewBox="0 0 500 200">
        <path class="line" d="M20,20 L20,180" />
        <path class="line" d="M480,20 L480,180" />
        
        <path class="heart-pro" d="M20,35 C20,15 50,15 50,35 C50,55 20,80 20,80 C20,80 -10,55 -10,35 C-10,15 20,15 20,35" />

        <g class="lttr">
          <path d="M42.2,73.9h11.4v52.1H42.2V73.9z"></path> <path d="M85.1,73.9h11.4v42.1h22.8v10H85.1V73.9z"></path> <path d="M123.9,100c0-15.2,11.7-26.9,27.2-26.9s27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9S123.9,115.2,123.9,100zM166.9,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C160.1,116.5,166.9,109.2,166.9,100z"></path> <path d="M180.7,73.9H193l8.4,22.9c1.7,4.7,3.5,9.5,5,14.2h0.1c1.7-4.8,3.4-9.4,5.2-14.3l8.6-22.8h11.7l-19.9,52.1h-11.5L180.7,73.9z"></path> <path d="M239.1,73.9h32.2v10h-20.7v10.2h17.9v9.5h-17.9v12.4H272v10h-33V73.9z"></path> <path d="M315.8,102.5l-20.1-28.6H309l6.3,9.4c2,3,4.2,6.4,6.3,9.6h0.1c2-3.2,4.1-6.4,6.3-9.6l6.3-9.4h12.9l-19.9,28.5v23.6h-11.4V102.5z"></path> <path d="M348.8,100c0-15.2,11.7-26.9,27.2-26.9c15.5,0,27.2,11.7,27.2,26.9s-11.7,26.9-27.2,26.9C360.5,126.9,348.8,115.2,348.8,100z M391.8,100c0-9.2-6.8-16.5-15.8-16.5c-9,0-15.8,7.3-15.8,16.5s6.8,16.5,15.8,16.5C385,116.5,391.8,109.2,391.8,100z"></path> <path d="M412.4,101.1V73.9h11.4v26.7c0,10.9,2.4,15.9,11.5,15.9c8.4,0,11.4-4.6,11.4-15.8V73.9h11v26.9c0,7.8-1.1,13.5-4,17.7c-3.7,5.3-10.4,8.4-18.7,8.4c-8.4,0-15.1-3.1-18.8-8.5C413.4,114.2,412.4,108.5,412.4,101.1z"></path> </g>
      </svg>
    </div>

    <h1 class="question">Will you be my Valentine?</h1>
    
    <div class="btn-row">
      <button id="yes">Yes! ❤️</button>
      <button id="no">No</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const noBtn = document.getElementById('no');
    const yesBtn = document.getElementById('yes');
    const bear = document.getElementById('bear');
    let scale = 1;

    function moveNo() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'fixed';
      noBtn.style.left = x + 'px';
      noBtn.style.top = y + 'px';
      
      scale += 0.2;
      yesBtn.style.transform = `scale(${scale})`;
      // Shocked bear
      bear.src = "https://media.tenor.com/XGf8O27Y-KAAAAAi/milk-and-mocha-bear.gif";
    }

    noBtn.addEventListener('mouseenter', moveNo);
    noBtn.addEventListener('touchstart', moveNo);

    yesBtn.addEventListener('click', () => {
      document.querySelector('.question').innerHTML = "I Love You Forever! ❤️";
      document.querySelector('.btn-row').style.display = 'none';
      document.querySelector('.anim-box').style.display = 'none';
      // Hugging bear
      bear.src = "https://media.tenor.com/Z-7u8mO0GvUAAAAi/milk-and-mocha.gif";
      confetti({ particleCount: 200, spread: 90, origin: { y: 0.6 } });
    });
  </script>
</body>
</html>
