<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Valentine ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
  <style>
    :root { --pink: #ff4d6d; --light: #ffe5ec; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      min-height: 100vh; display: flex; justify-content: center; align-items: center; 
      background: var(--light); font-family: 'Pacifico', cursive; overflow: hidden; 
    }
    .card { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; }

    /* BEAR SECTION */
    .bear-box img { width: 150px; height: auto; margin-bottom: 10px; }

    /* THE PROFESSIONAL ANIMATION */
    .anim-container { width: 400px; height: 150px; position: relative; margin: 20px 0; }
    .svg-main { width: 100%; height: 100%; fill: var(--pink); overflow: visible; }

    /* Sliding Lines with "Bounce" */
    .line { 
      fill: none; stroke: var(--pink); stroke-width: 8; stroke-linecap: round;
      stroke-dasharray: 300; stroke-dashoffset: 300;
      animation: draw 4s cubic-bezier(0.175, 0.885, 0.32, 1.275) infinite; 
    }
    @keyframes draw {
      0% { stroke-dashoffset: 300; }
      20%, 80% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -300; }
    }

    /* Heart Burst */
    .heart { 
      opacity: 0; transform-origin: center;
      animation: heartPop 4s ease-in-out infinite; 
    }
    @keyframes heartPop {
      0%, 25% { opacity: 0; transform: translate(175px, 50px) scale(0); }
      40% { opacity: 1; transform: translate(175px, 50px) scale(1.4); }
      50%, 80% { opacity: 1; transform: translate(175px, 50px) scale(1); }
      100% { opacity: 0; transform: translate(175px, 50px) scale(0); }
    }

    /* Letters Reveal */
    .lttr { opacity: 0; animation: reveal 4s ease infinite; }
    @keyframes reveal {
      0%, 35% { opacity: 0; transform: translateY(10px); }
      45%, 85% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; }
    }

    /* UI ELEMENTS */
    .question { color: var(--pink); font-size: 2rem; margin: 10px 0; }
    .btn-group { display: flex; justify-content: center; align-items: center; gap: 30px; min-height: 120px; width: 100%; position: relative; }
    
    button { padding: 12px 30px; font-size: 1.3rem; font-family: 'Pacifico', cursive; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    #yesBtn { background: var(--pink); color: white; z-index: 100; transition: transform 0.2s; }
    #noBtn { background: white; color: var(--pink); position: absolute; left: 55%; z-index: 100; }
  </style>
</head>
<body>

  <div class="card">
    <div class="bear-box">
      <img src="https://media.tenor.com/7S8l0N9M7mUAAAAi/milk-and-mocha-bear-couple.gif" id="bear">
    </div>

    <div class="anim-container">
      <svg class="svg-main" viewBox="0 0 400 150">
        <path class="line" d="M10,10 L10,140" />
        <path class="line" d="M390,10 L390,140" />
        
        <path class="heart" d="M25,40 C25,20 55,20 55,40 C55,60 25,85 25,85 C25,85 -5,60 -5,40 C-5,20 25,20 25,40" />

        <g class="lttr">
          <path d="M42,50h10v50H42V50z"></path> <path d="M70,50h10v40h20v10H70V50z"></path> <path d="M105,75c0-15,10-25,25-25s25,10,25,25s-10,25-25,25S105,90,105,75z M145,75c0-10-5-15-15-15s-15,5-15,15s5,15,15,15S145,85,145,75z"></path> <path d="M165,50h10l10,30l10-30h10l-15,50h-10L165,50z"></path> <path d="M215,50h25v10h-15v10h12v10h-12v10h15v10h-25V50z"></path> <path d="M265,50l15,25v25h10V75l15-25h-11l-9,15l-9-15H265z"></path> <path d="M310,75c0-15,10-25,25-25s25,10,25,25s-10,25-25,25S310,90,310,75z M350,75c0-10-5-15-15-15s-15,5-15,15s5,15,15,15S350,85,350,75z"></path> <path d="M370,50h10v30c0,10,5,15,10,15s10-5,10-15V50h10v30c0,20-10,25-20,25s-20-5-20-25V50z"></path> </g>
      </svg>
    </div>

    <h1 class="question">Will you be my Valentine??</h1>
    
    <div class="btn-group">
      <button id="yesBtn">Yes! ❤️</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const bearImg = document.getElementById('bear');
    let scale = 1;

    function moveNo() {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.position = 'fixed';
        noBtn.style.left = x + 'px';
        noBtn.style.top = y + 'px';
        scale += 0.2;
        yesBtn.style.transform = `scale(${scale})`;
        bearImg.src = "https://media.tenor.com/XGf8O27Y-KAAAAAi/milk-and-mocha-bear.gif";
    }

    noBtn.addEventListener('mouseover', moveNo);
    noBtn.addEventListener('click', moveNo);

    yesBtn.addEventListener('click', () => {
        document.querySelector('.question').innerHTML = "I Love You So Much! ❤️";
        document.querySelector('.btn-group').style.display = 'none';
        document.querySelector('.anim-container').style.display = 'none';
        bearImg.src = "https://media.tenor.com/Z-7u8mO0GvUAAAAi/milk-and-mocha.gif";
        confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
    });
  </script>
</body>
</html>
